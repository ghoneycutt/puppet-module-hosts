---
# Offenses that predate the adoption of the voxpupuli-rubocop ruleset are
# excluded here rather than fixed, to avoid a mass style rewrite that would
# obliterate git history and conflict with open PRs. New code outside these
# exclusions must comply.

Layout/FirstHashElementIndentation:
  Exclude:
    - 'spec/**/*'

Layout/LineLength:
  Exclude:
    - 'spec/**/*'

Lint/RedundantDirGlobSort:
  Exclude:
    - 'spec/**/*'

Naming/HeredocDelimiterNaming:
  Exclude:
    - 'spec/**/*'

RSpec/ContextWording:
  Exclude:
    - 'spec/**/*'

RSpec/DescribeClass:
  Exclude:
    - 'spec/**/*'

RSpec/HookArgument:
  Exclude:
    - 'spec/**/*'

RSpec/ImplicitSubject:
  Exclude:
    - 'spec/**/*'

RSpec/LeakyLocalVariable:
  Exclude:
    - 'spec/**/*'

RSpec/NoExpectationExample:
  Exclude:
    - 'spec/**/*'

RSpec/VoidExpect:
  Exclude:
    - 'spec/**/*'

Style/Dir:
  Exclude:
    - 'spec/**/*'

Style/FrozenStringLiteralComment:
  Exclude:
    - 'spec/**/*'

Style/IfUnlessModifier:
  Exclude:
    - 'spec/**/*'

Style/MixinUsage:
  Exclude:
    - 'spec/**/*'

Style/RegexpLiteral:
  Exclude:
    - 'spec/**/*'

Style/RescueStandardError:
  Exclude:
    - 'spec/**/*'

Style/TrailingCommaInHashLiteral:
  Exclude:
    - 'spec/**/*'

Style/YAMLFileRead:
  Exclude:
    - 'spec/**/*'
